name: Restore Tripfinder baseline 420c860

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RESTORE-420C860 to create the rollback pull request
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  restore-baseline:
    if: github.event.inputs.confirmation == 'RESTORE-420C860'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Back up current main and prepare the baseline snapshot
        env:
          TARGET_COMMIT: 420c860c9605fdf7f6486bfb3d7e4c26488b8636
        run: |
          set -euo pipefail

          git cat-file -e "${TARGET_COMMIT}^{commit}"
          RUN_ID="${GITHUB_RUN_ID}"
          BACKUP_BRANCH="backup-before-restore-420c860-${RUN_ID}"
          RESTORE_BRANCH="restore-baseline-420c860-${RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the exact current main commit before changing the tree.
          git branch "${BACKUP_BRANCH}" HEAD
          git push origin "${BACKUP_BRANCH}"

          # Create a normal commit whose tracked file tree exactly matches 420c860.
          git switch -c "${RESTORE_BRANCH}"
          git read-tree --reset -u "${TARGET_COMMIT}"
          git clean -fd
          git add -A

          if git diff --cached --quiet; then
            echo "The current main tree already matches the requested baseline. No PR is needed."
            exit 0
          fi

          git commit -m "Restore repository file tree to baseline 420c860"
          git push origin "${RESTORE_BRANCH}"

          echo "BACKUP_BRANCH=${BACKUP_BRANCH}" >> "${GITHUB_ENV}"
          echo "RESTORE_BRANCH=${RESTORE_BRANCH}" >> "${GITHUB_ENV}"

      - name: Open rollback pull request
        if: env.RESTORE_BRANCH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "${RESTORE_BRANCH}" \
            --title "Restore Tripfinder to baseline 420c860" \
            --body "This PR restores the tracked repository file tree to commit 420c860c9605fdf7f6486bfb3d7e4c26488b8636. It preserves Git history and does not force-push main. A backup branch was created first: ${BACKUP_BRANCH}. Review the file changes before merging."
